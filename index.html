<head>

  <style>
    :root {
      --bg: #050a1c;
      --card: rgba(12, 22, 52, .7);
      --border: rgba(120, 170, 255, .16);
      --text: #eef3ff;
      --muted: #8fa3cc;
      --accent: #4da3ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    /* The gradient lives on <html>, not <body>: the 3D canvas sits at z-index -1,
       and a body background would be painted on top of it and hide it. */
    html { background: radial-gradient(ellipse at 50% 0%, #0f2a66 0%, #08143a 45%, #050a1c 100%) fixed, var(--bg); }
    body {
      min-height: 100vh; min-height: 100dvh;
      color: var(--text);
      font-family: "Poppins", system-ui, sans-serif;
      display: flex; justify-content: center;
      padding: 56px 16px calc(40px + env(safe-area-inset-bottom));
      overflow-x: hidden;
    }

    main { width: 100%; max-width: 440px; text-align: center; position: relative; }

    .avatar {
      display: block; width: 160px; height: 160px; margin: 0 auto 18px;
      border-radius: 50%; object-fit: cover;
      box-shadow: 0 0 0 rgba(77, 163, 255, 0);
      transition: box-shadow .35s ease, transform .35s ease;
      animation: rise .7s ease-out both;
    }
    .avatar:hover { transform: translateY(-4px); box-shadow: 0 18px 36px -6px rgba(77, 163, 255, .65); }
    /* Shown instead of the photo when avatar.jpg is missing */
    .avatar.initials {
      display: grid; place-items: center;
      background: linear-gradient(135deg, #123a85, #0a1e4d);
      font-size: 56px; font-weight: 700; color: #cfe3ff;
    }

    h1 {
      font-size: 26px; font-weight: 700; letter-spacing: .3px; margin-bottom: 6px;
      background: linear-gradient(100deg, #fff 40%, #8cc4ff 50%, #fff 60%);
      background-size: 250% 100%;
      -webkit-background-clip: text; background-clip: text; color: transparent;
      animation: rise .7s .1s ease-out both, shine 5s 1s linear infinite;
    }
    .bio { color: var(--muted); font-size: 14px; margin-bottom: 28px; animation: rise .7s .15s ease-out both; }
    @keyframes shine { from { background-position: 100% 0; } to { background-position: -150% 0; } }

    ul { list-style: none; display: flex; flex-direction: column; gap: 12px; }
    li { animation: rise .55s ease-out both; animation-delay: calc(.2s + var(--i) * .07s); }
    a.link {
      position: relative; overflow: hidden;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      min-height: 52px; padding: 14px 20px; border-radius: 999px;
      background: var(--card); border: 1px solid var(--border);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      color: var(--text); text-decoration: none; font-size: 16px; font-weight: 600;
      transition: border-color .25s, box-shadow .25s, transform .25s;
    }
    a.link::after {
      content: ""; position: absolute; top: 0; bottom: 0; left: -60%; width: 40%;
      background: linear-gradient(100deg, transparent, rgba(160,200,255,.18), transparent);
      transform: skewX(-20deg); transition: left .6s ease;
    }
    a.link:hover, a.link:focus-visible {
      border-color: var(--accent); box-shadow: 0 0 22px rgba(77, 163, 255, .5);
      transform: translateY(-3px) scale(1.015); outline: none;
    }
    a.link:hover::after, a.link:focus-visible::after { left: 120%; }
    a.link:active { transform: scale(.98); }
    a.link svg { width: 20px; height: 20px; flex-shrink: 0; fill: currentColor; transition: transform .25s; }
    a.link:hover svg { transform: scale(1.15); }

    /* Small label that starts a new group of links */
    li.section {
      display: flex; align-items: center; gap: 12px; margin-top: 14px;
      color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: 2.5px; text-transform: uppercase;
    }
    li.section::before, li.section::after {
      content: ""; flex: 1; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(77,163,255,.55), transparent);
    }

    footer { margin-top: 40px; color: var(--muted); font-size: 12px; animation: rise .6s .8s ease-out both; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } }

    @media (max-width: 480px) { .avatar { width: 144px; height: 144px; } h1 { font-size: 24px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>

      a.className = "link";
      a.href = l.url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.innerHTML = `<svg viewBox="${VIEWBOX[l.icon] || "0 0 24 24"}" aria-hidden="true" style="color:${l.color || "currentColor"}">${ICONS[l.icon] || ICONS.web}</svg>`;
      a.append(l.title);
      li.append(a);
      list.append(li);
    });

    // Background: a 3D network (Three.js). The dots drift through depth, the whole thing sways slowly,
    // and it tilts a little toward your finger or mouse. If WebGL or the library is missing,
    // a flat 2D version is used instead, so the page never ends up with an empty background.
    (() => {
      const still = matchMedia("(prefers-reduced-motion: reduce)").matches;

      function makeCanvas() {
        const c = document.createElement("canvas");
        c.style.cssText = "position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none";
        document.body.prepend(c);
        return c;
      }

      // ---------- 3D ----------
      function network3D() {
        const canvas = makeCanvas();
        let renderer;
        try {
          renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        } catch (e) {
          canvas.remove();
          return false;
        }
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

        const radial = (size, stops, cx, cy, r) => {
          const c = document.createElement("canvas");
          c.width = c.height = size;
          const x = c.getContext("2d");
          const g = x.createRadialGradient(cx, cy, 0, cx, cy, r);
          stops.forEach(([at, color]) => g.addColorStop(at, color));
          x.fillStyle = g;
          x.fillRect(0, 0, size, size);
          return new THREE.CanvasTexture(c);
        };

        const scene = new THREE.Scene();
        // Same glow as the page gradient, drawn as the scene background
        scene.background = radial(256, [[0, "#0f2a66"], [.45, "#08143a"], [1, "#050a1c"]], 128, 0, 256);

        const camera = new THREE.PerspectiveCamera(55, 1, 1, 400);
        camera.position.z = 70;
        const halfFov = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));

        const group = new THREE.Group();
        scene.add(group);

        const glow = radial(64, [[0, "rgba(255,255,255,1)"], [.22, "rgba(255,255,255,.85)"], [.5, "rgba(255,255,255,.2)"], [1, "rgba(255,255,255,0)"]], 32, 32, 32);
        const glowing = { map: glow, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true };
        const dotMat = new THREE.PointsMaterial({ ...glowing, color: 0x8cc8ff, size: 2.2 });
        const hubMat = new THREE.PointsMaterial({ ...glowing, color: 0xd6eaff, size: 4.6 });
        const lineMat = new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending });

        let N, H, X, Y, Z, VX, VY, VZ, box, link, maxSegs;
        let dotPos, hubPos, linePos, lineCol, dotGeo, hubGeo, lineGeo;
        let builtWidth = 0;

        function build() {
          for (const o of [...group.children]) { group.remove(o); o.geometry.dispose(); }
          const w = innerWidth, h = innerHeight;
          builtWidth = w;
          const small = w < 600;
          N = small ? 72 : 118;   // all dots
          H = small ? 8 : 14;     // the first H are bigger "hub" dots
          const visibleHalfH = halfFov * camera.position.z;
          box = { x: visibleHalfH * (w / h) * 1.3, y: visibleHalfH * 1.3, z: 32 };
          link = Math.sqrt((4 * box.x * box.y) / N) * 1.9;   // how close two dots must be to get a line
          maxSegs = N * 7;

          X = new Float32Array(N); Y = new Float32Array(N); Z = new Float32Array(N);
          VX = new Float32Array(N); VY = new Float32Array(N); VZ = new Float32Array(N);
          for (let i = 0; i < N; i++) {
            X[i] = (Math.random() * 2 - 1) * box.x;
            Y[i] = (Math.random() * 2 - 1) * box.y;
            Z[i] = (Math.random() * 2 - 1) * box.z;
            VX[i] = (Math.random() - .5) * 4;
            VY[i] = (Math.random() - .5) * 4;
            VZ[i] = (Math.random() - .5) * 3;
          }

          dotPos = new Float32Array((N - H) * 3);
          hubPos = new Float32Array(H * 3);
          linePos = new Float32Array(maxSegs * 6);
          lineCol = new Float32Array(maxSegs * 6);
          dotGeo = new THREE.BufferGeometry();
          dotGeo.setAttribute("position", new THREE.BufferAttribute(dotPos, 3).setUsage(THREE.DynamicDrawUsage));
          hubGeo = new THREE.BufferGeometry();
          hubGeo.setAttribute("position", new THREE.BufferAttribute(hubPos, 3).setUsage(THREE.DynamicDrawUsage));
          lineGeo = new THREE.BufferGeometry();
          lineGeo.setAttribute("position", new THREE.BufferAttribute(linePos, 3).setUsage(THREE.DynamicDrawUsage));
          lineGeo.setAttribute("color", new THREE.BufferAttribute(lineCol, 3).setUsage(THREE.DynamicDrawUsage));
          lineGeo.setDrawRange(0, 0);

          const lines = new THREE.LineSegments(lineGeo, lineMat);
          const dots = new THREE.Points(dotGeo, dotMat);
          const hubs = new THREE.Points(hubGeo, hubMat);
          // Positions change every frame, so the one-time bounding sphere would wrongly cull them
          for (const o of [lines, dots, hubs]) o.frustumCulled = false;
          group.add(lines, dots, hubs);
        }

        function step(dt) {
          for (let i = 0; i < N; i++) {
            X[i] += VX[i] * dt; Y[i] += VY[i] * dt; Z[i] += VZ[i] * dt;
            if (X[i] > box.x || X[i] < -box.x) VX[i] = -VX[i];
            if (Y[i] > box.y || Y[i] < -box.y) VY[i] = -VY[i];
            if (Z[i] > box.z || Z[i] < -box.z) VZ[i] = -VZ[i];
            if (i < H) {
              hubPos[i * 3] = X[i]; hubPos[i * 3 + 1] = Y[i]; hubPos[i * 3 + 2] = Z[i];
            } else {
              const k = (i - H) * 3;
              dotPos[k] = X[i]; dotPos[k + 1] = Y[i]; dotPos[k + 2] = Z[i];
            }
          }
          dotGeo.attributes.position.needsUpdate = true;
          hubGeo.attributes.position.needsUpdate = true;

          // A line between every two dots that are close enough; farther apart = fainter, nearer the camera = brighter
          const link2 = link * link;
          let s = 0;
          outer:
          for (let i = 0; i < N; i++) {
            for (let j = i + 1; j < N; j++) {
              const dx = X[i] - X[j], dy = Y[i] - Y[j], dz = Z[i] - Z[j];
              const d2 = dx * dx + dy * dy + dz * dz;
              if (d2 >= link2) continue;
              const fade = 1 - Math.sqrt(d2) / link;
              const near = .55 + .45 * ((Z[i] + Z[j]) / (4 * box.z) + .5);
              const a = fade * near * 1.1;
              const o = s * 6;
              linePos[o] = X[i]; linePos[o + 1] = Y[i]; linePos[o + 2] = Z[i];
              linePos[o + 3] = X[j]; linePos[o + 4] = Y[j]; linePos[o + 5] = Z[j];
              const r = .3 * a, g = .62 * a;
              lineCol[o] = r; lineCol[o + 1] = g; lineCol[o + 2] = a;
              lineCol[o + 3] = r; lineCol[o + 4] = g; lineCol[o + 5] = a;
              if (++s >= maxSegs) break outer;
            }
          }
          lineGeo.setDrawRange(0, s * 2);
          lineGeo.attributes.position.needsUpdate = true;
          lineGeo.attributes.color.needsUpdate = true;
        }

        const pointer = { x: 0, y: 0 }, aim = { x: 0, y: 0 };   // -1..1; the pointer eases toward the aim
        let time = 0, last = performance.now();

        function draw(dt) {
          time += dt;
          step(dt);
          pointer.x += (aim.x - pointer.x) * Math.min(1, dt * 3);
          pointer.y += (aim.y - pointer.y) * Math.min(1, dt * 3);
          group.rotation.y = Math.sin(time * .13) * .3 + pointer.x * .35;
          group.rotation.x = Math.sin(time * .09) * .1 + pointer.y * .22;
          renderer.render(scene, camera);
        }

        function frame(now) {
          const dt = Math.min((now - last) / 1000, .05);   // a long pause (hidden tab) must not make the dots jump
          last = now;
          draw(dt);
          requestAnimationFrame(frame);
        }

        function resize() {
          const w = innerWidth, h = innerHeight;
          renderer.setSize(w, h, false);
          camera.aspect = w / h;
          camera.updateProjectionMatrix();
          // On phones the address bar only changes the height; keep the same dots then
          if (Math.abs(w - builtWidth) > 40) build();
          if (still) draw(0);
        }

        const aimAt = (x, y) => { aim.x = x / innerWidth * 2 - 1; aim.y = y / innerHeight * 2 - 1; };
        addEventListener("pointermove", e => aimAt(e.clientX, e.clientY), { passive: true });
        addEventListener("touchmove", e => aimAt(e.touches[0].clientX, e.touches[0].clientY), { passive: true });
        addEventListener("resize", resize);

        resize();
        if (!still) requestAnimationFrame(frame);
        document.body.dataset.bg = "3d";
        return true;
      }

      // ---------- flat 2D fallback ----------
      function network2D() {
        const canvas = makeCanvas();
        const ctx = canvas.getContext("2d");
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const pointer = { x: -9999, y: -9999 };
        let w, h, dots = [], reach = 130;

        function resize() {
          w = innerWidth; h = innerHeight;
          canvas.width = w * dpr; canvas.height = h * dpr;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          reach = w < 600 ? 105 : 135;
          const count = Math.round(Math.min(110, (w * h) / 11000));
          dots = Array.from({ length: count }, () => ({
            x: Math.random() * w, y: Math.random() * h,
            vx: (Math.random() - .5) * .35, vy: (Math.random() - .5) * .35,
            r: Math.random() * 1.4 + .8
          }));
        }

        function frame() {
          ctx.clearRect(0, 0, w, h);
          if (!still) {
            for (const d of dots) {
              d.x += d.vx; d.y += d.vy;
              if (d.x < -10) d.x = w + 10; else if (d.x > w + 10) d.x = -10;
              if (d.y < -10) d.y = h + 10; else if (d.y > h + 10) d.y = -10;
            }
          }
          ctx.lineWidth = 1;
          for (let i = 0; i < dots.length; i++) {
            const a = dots[i];
            for (let j = i + 1; j < dots.length; j++) {
              const b = dots[j], dist = Math.hypot(a.x - b.x, a.y - b.y);
              if (dist < reach) {
                ctx.strokeStyle = `rgba(90, 165, 255, ${(1 - dist / reach) * .35})`;
                ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
              }
            }
            const pd = Math.hypot(a.x - pointer.x, a.y - pointer.y);
            if (pd < reach * 1.5) {
              ctx.strokeStyle = `rgba(150, 205, 255, ${(1 - pd / (reach * 1.5)) * .6})`;
              ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(pointer.x, pointer.y); ctx.stroke();
            }
            ctx.fillStyle = "rgba(140, 200, 255, .85)";
            ctx.shadowBlur = 8; ctx.shadowColor = "rgba(77, 163, 255, .9)";
            ctx.beginPath(); ctx.arc(a.x, a.y, a.r, 0, Math.PI * 2); ctx.fill();
            ctx.shadowBlur = 0;
          }
          if (!still) requestAnimationFrame(frame);
        }

        const move = e => { const t = e.touches ? e.touches[0] : e; pointer.x = t.clientX; pointer.y = t.clientY; };
        const leave = () => { pointer.x = pointer.y = -9999; };
        addEventListener("pointermove", move, { passive: true });
        addEventListener("touchmove", move, { passive: true });
        addEventListener("pointerleave", leave);
        addEventListener("touchend", leave);
        addEventListener("resize", resize);
        resize(); frame();
        document.body.dataset.bg = "2d";
      }

      if (!(window.THREE && network3D())) network2D();
    })();
  </script>
</body>
</html>
